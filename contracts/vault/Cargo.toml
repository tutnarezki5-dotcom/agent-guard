[package]
name = "agentguard-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AgentGuard vault contract: pays only with a fresh AgentGuard signature, within an exact per-mandate budget."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"
agentguard-vault-core = { path = "../vault-core", features = ["near"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# Build:  cargo near build non-reproducible-wasm   (needs cargo-near: https://github.com/near/cargo-near)
